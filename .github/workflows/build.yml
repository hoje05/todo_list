name: CI & Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, unit, E2E & Rust tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run check # typecheck + eslint + vitest
      - run: npm run build

      - name: E2E (Chromium, mocked IPC on real SQLite)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Rust tests & clippy
        working-directory: src-tauri
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

  windows:
    name: Windows build (exe + installers)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Unsigned build: no code-signing certificate is configured.
      - run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: DeskTodo-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/desktodo.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
