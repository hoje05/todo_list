[package]
name = "desktodo"
version = "0.1.0"
description = "Lightweight desktop To-Do & Planner"
authors = ["DeskTodo"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "desktodo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-sql = { version = "2.6", features = ["sqlite"] }
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
